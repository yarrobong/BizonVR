#cloud-config
# Cloud-init для подготовки сервера под BizonVR (Python + PostgreSQL + Nginx + SSL).
# В панели облака при создании сервера вставьте этот файл в поле «User data» / «Cloud-init» / «Скрипт инициализации».

package_update: true
package_upgrade: true

packages:
  - git
  - nginx
  - certbot
  - python3-certbot-nginx
  - python3
  - python3-venv
  - python3-pip
  - postgresql
  - postgresql-contrib
  - libpq-dev

runcmd:
  - systemctl enable postgresql
  - systemctl start postgresql
  - systemctl enable nginx
  - systemctl start nginx
  - timedatectl set-timezone Europe/Moscow 2>/dev/null || true

final_message: "BizonVR server ready. Python, PostgreSQL, Nginx and Certbot installed. Next: SSH to server, clone repo, create .env and follow DEPLOY.md."
