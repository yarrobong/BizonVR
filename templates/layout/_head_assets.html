{% load static %}
<!-- Favicon & app icons (multi-device) -->
<link rel="icon" type="image/svg+xml" href="{% static 'images/favicon.svg' %}">
<link rel="icon" type="image/png" sizes="32x32" href="{% static 'images/favicon-32x32.png' %}">
<link rel="icon" type="image/png" sizes="16x16" href="{% static 'images/favicon-16x16.png' %}">
<link rel="apple-touch-icon" sizes="180x180" href="{% static 'images/apple-touch-icon.png' %}">
<link rel="manifest" href="{% static 'site.webmanifest' %}">
<link rel="shortcut icon" href="/favicon.ico">
<!-- Android/Chrome (optional, for "Add to Home Screen") -->
<link rel="icon" type="image/png" sizes="192x192" href="{% static 'images/android-chrome-192x192.png' %}">
<link rel="icon" type="image/png" sizes="512x512" href="{% static 'images/android-chrome-512x512.png' %}">

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<!-- Tailwind CSS -->
<link rel="stylesheet" href="{% static 'css/tailwind.css' %}">
<link rel="stylesheet" href="{% static 'css/layout/base.css' %}">

<!-- HTMX & Alpine.js -->
<script defer src="https://unpkg.com/htmx.org@1.9.10"></script>
<script defer src="{% static 'js/layout/base.js' %}"></script>
<script defer src="https://unpkg.com/alpinejs@3.13.3/dist/cdn.min.js"></script>

<!-- Lucide Icons -->
<script defer src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
