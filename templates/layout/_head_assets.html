{% load static %}
<!-- Favicon & app icons (multi-device) -->
<link rel="icon" type="image/svg+xml" href="{% static 'images/favicon.svg' %}">
<link rel="icon" type="image/png" sizes="32x32" href="{% static 'images/favicon-32x32.png' %}">
<link rel="icon" type="image/png" sizes="16x16" href="{% static 'images/favicon-16x16.png' %}">
<link rel="apple-touch-icon" sizes="180x180" href="{% static 'images/apple-touch-icon.png' %}">
<link rel="manifest" href="{% static 'site.webmanifest' %}">
<link rel="shortcut icon" href="/favicon.ico">
<!-- Android/Chrome (optional, for "Add to Home Screen") -->
<link rel="icon" type="image/png" sizes="192x192" href="{% static 'images/android-chrome-192x192.png' %}">
<link rel="icon" type="image/png" sizes="512x512" href="{% static 'images/android-chrome-512x512.png' %}">

<!-- Fonts -->
<!-- Use the local/system font stack so the UI does not depend on Google Fonts availability. -->

<!-- Tailwind CSS -->
<link rel="stylesheet" href="{% static 'css/tailwind.css' %}">
<link rel="stylesheet" href="{% static 'css/layout/base.css' %}">

<!-- HTMX & Alpine.js -->
<script defer src="{% static 'vendor/htmx/htmx-1.9.10.min.js' %}"></script>
<script defer src="{% static 'js/layout/base.js' %}"></script>
<script defer src="{% static 'vendor/alpine/alpine-3.13.3-cdn.min.js' %}"></script>

<!-- Lucide Icons -->
<script defer src="{% static 'vendor/lucide/lucide-0.468.0.min.js' %}"></script>
