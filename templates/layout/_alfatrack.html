{% load site_flags %}
{% enable_alfatrack as alfatrack_enabled %}
{% if alfatrack_enabled %}
  <!-- Alfa-Track -->
  <link rel="dns-prefetch" href="//cloud.emailtracking.ru">
  <link rel="preconnect" href="https://cloud.emailtracking.ru" crossorigin="">

  <script>
    (function (w) {
      var trackerLoader = w.BizonVRTrackerLoader;
      var hostname = w.location && w.location.hostname;
      var isHeavyCatalogPage = {{ defer_public_tracking_heavily|yesno:"true,false" }};
      var version = Math.floor(Date.now() / 3600000);
      var mirrors = [
        'https://cloud.emailtracking.ru/gtm/script.js',
        'https://cloud.alfa-track.com/gtm/script.js'
      ];
      var loadedMirrorIndex = -1;

      w.alfatrack = w.alfatrack || {};
      w.alfatrack.token = 'Co3FRFhjX2';

      if (
        hostname === 'localhost'
        || hostname === '127.0.0.1'
        || hostname === '[::1]'
        || hostname === '::1'
        || (hostname && hostname.slice(-6) === '.local')
      ) {
        return;
      }

      if (!trackerLoader) {
        return;
      }

      function tryLoadMirror(index) {
        var baseUrl = mirrors[index];
        if (!baseUrl) {
          return;
        }

        trackerLoader.loadScriptOnce(baseUrl + '?ver=' + version, {
          async: true,
          crossOrigin: 'anonymous',
          referrerPolicy: 'strict-origin-when-cross-origin',
          onLoad: function () {
            if (loadedMirrorIndex !== -1) {
              return;
            }
            loadedMirrorIndex = index;
            if (typeof w.alfatrack.initParameters === 'function') {
              w.alfatrack.initParameters();
            }
          },
          onError: function () {
            if (loadedMirrorIndex !== -1) {
              return;
            }
            tryLoadMirror(index + 1);
          }
        });
      }

      trackerLoader.afterRender(function () {
        tryLoadMirror(0);
      }, {
        idleTimeout: isHeavyCatalogPage ? 7000 : 3000,
        delay: isHeavyCatalogPage ? 3000 : 1000
      });
    })(window);
  </script>
  <!-- End Alfa-Track -->
{% endif %}
