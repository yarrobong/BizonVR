{% load catalog_tags %}
<!-- Левая панель фильтров: только на десктопе, сразу применяются по клику -->
<aside class="catalog-filters w-full hidden lg:block">
  <div class="filters-panel filters-panel--quick sticky top-24 flex flex-col">
    <div class="filters-panel-header filters-panel-header--quick flex items-start justify-between gap-3">
      <div class="min-w-0">
        <h3 class="filters-panel-title">Быстрые фильтры</h3>
        <p class="filters-panel-note">Категория, цена и ключевые параметры без лишнего шума.</p>
      </div>
      <button type="button"
              class="filter-ghost-button filter-ghost-button--quick"
              @click="filtersModalOpen = true">
        {% lucide_icon "sliders-horizontal" "w-4 h-4" %}
        Все
      </button>
    </div>

    <div class="filters-panel-body filters-panel-body--quick filters-panel-scroll">
      {% include "catalog/product_list/_filters_summary.html" %}
    </div>

    {% if not is_catalog_root %}
    <div class="filters-panel-footer filters-panel-footer--quick">
      <a href="{% url 'catalog:product_list' %}" class="filter-secondary-link filter-secondary-link--inline">
        Сбросить фильтры
      </a>
    </div>
    {% endif %}
  </div>
</aside>
