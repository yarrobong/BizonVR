{% load catalog_tags %}
{% for ch_name, ch_values in filter_characteristics.items %}
{% with char_key="char_"|add:ch_name %}
<div>
  <div class="text-[10px] text-gray-500 uppercase mb-2">{{ ch_name }}</div>
  <div class="space-y-1">
    <a href="{% url 'catalog:product_list' %}{% filter_url_unset char_key %}"
       class="block text-sm py-1.5 rounded px-2 transition-colors {% if not char_filters|get_item:ch_name %}text-accent font-medium{% else %}text-gray-400 hover:text-white{% endif %}">Все</a>
    {% for val in ch_values %}
    <a href="{% url 'catalog:product_list' %}{% filter_url_set char_key val %}"
       class="block text-sm py-1.5 rounded px-2 transition-colors {% if char_filters|get_item:ch_name == val %}text-accent font-medium{% else %}text-gray-400 hover:text-white{% endif %}">{{ val }}</a>
    {% endfor %}
  </div>
</div>
{% endwith %}
{% endfor %}
