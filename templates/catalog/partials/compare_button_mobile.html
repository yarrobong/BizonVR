<form action="{% url 'catalog:toggle_compare' product.pk %}"
      method="post"
      hx-boost="false"
      hx-post="{% url 'catalog:toggle_compare' product.pk %}"
      hx-target="closest form"
      hx-select="form"
      hx-swap="outerHTML"
      hx-push-url="false">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ request.get_full_path }}" />
  <input type="hidden" name="compact" value="1" />
  <button type="submit"
          class="pd-mobile-icon-btn"
          aria-label="{% if is_compared %}Убрать из сравнения{% else %}Добавить в сравнение{% endif %}"
          {% if compare_count >= compare_limit|default:4 and not is_compared %}disabled{% endif %}>
    <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="{% if is_compared %}#00d4ff{% else %}currentColor{% endif %}" stroke-width="2">
      <path d="M12 3v18M5 7h5M14 17h5M7 7l-2 3 2 3M17 17l2-3-2-3" stroke-linecap="round" stroke-linejoin="round"></path>
    </svg>
  </button>
</form>
