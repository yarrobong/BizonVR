{% with limit=compare_limit|default:4 %}
<form action="{% url 'catalog:toggle_compare' product.pk %}"
      method="post"
      class="inline"
      hx-boost="false"
      hx-post="{% url 'catalog:toggle_compare' product.pk %}"
      hx-target="closest form"
      hx-select="form"
      hx-swap="outerHTML"
      hx-push-url="false"
      @click.stop>
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ request.get_full_path }}" />
  <button type="submit"
          class="inline-flex items-center gap-2 rounded-full border px-3 py-2 text-xs font-medium transition-colors {% if is_compared %}border-accent/50 bg-accent/10 text-accent{% else %}border-white/10 bg-white/5 text-white hover:border-white/20 hover:bg-white/10{% endif %}"
          {% if compare_count >= limit and not is_compared %}disabled{% endif %}
          aria-label="{% if is_compared %}Убрать из сравнения{% elif compare_count >= limit %}Достигнут лимит сравнения{% else %}Добавить в сравнение{% endif %}"
          title="{% if is_compared %}Убрать из сравнения{% elif compare_count >= limit %}Максимум 4 товара{% else %}Сравнить{% endif %}">
    <i data-lucide="scale" class="w-4 h-4 inline-block"></i>
    <span>
      {% if is_compared %}
        В сравнении
      {% elif compare_count >= limit %}
        Максимум 4
      {% else %}
        Сравнить
      {% endif %}
    </span>
  </button>
</form>
{% endwith %}
