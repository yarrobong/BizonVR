<section class="container mx-auto px-4 mt-12 mb-8">
  <style>
    .footer-products-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.5rem;
    }
    .footer-products-loader {
      height: 2.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
    }
    .footer-products-loader-dot {
      width: 0.45rem;
      height: 0.45rem;
      border-radius: 9999px;
      background: #00d4ff;
      opacity: 0.28;
      animation: footer-products-dot 1.1s infinite ease-in-out;
    }
    .footer-products-loader-dot:nth-child(2) {
      animation-delay: 0.15s;
    }
    .footer-products-loader-dot:nth-child(3) {
      animation-delay: 0.3s;
    }
    @keyframes footer-products-dot {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.28; }
      40% { transform: translateY(-3px); opacity: 1; }
    }
    /* Скелетон — резервирует место под карточки, без скачков */
    .footer-products-skeleton {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.5rem;
    }
    @media (min-width: 768px) {
      .footer-products-grid,
      .footer-products-skeleton {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 0.75rem;
      }
    }
    @media (min-width: 1024px) {
      .footer-products-grid,
      .footer-products-skeleton {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }
    @media (min-width: 1280px) {
      .footer-products-grid,
      .footer-products-skeleton {
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 1rem;
      }
    }
    .footer-products-skeleton-card {
      display: flex;
      flex-direction: column;
      border-radius: 0.75rem;
      overflow: hidden;
      background: rgba(31, 37, 50, 0.5);
      border: 1px solid rgba(45, 48, 57, 0.8);
    }
    .footer-products-skeleton-card .skeleton-image {
      width: 100%;
      aspect-ratio: 1;
      background: linear-gradient(90deg, rgba(45, 48, 57, 0.4) 25%, rgba(55, 60, 72, 0.5) 50%, rgba(45, 48, 57, 0.4) 75%);
      background-size: 200% 100%;
      animation: footer-products-skeleton-shine 1.5s ease-in-out infinite;
    }
    .footer-products-skeleton-card .skeleton-content {
      padding: 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .footer-products-skeleton-card .skeleton-line {
      height: 0.75rem;
      border-radius: 0.25rem;
      background: rgba(45, 48, 57, 0.6);
    }
    .footer-products-skeleton-card .skeleton-line:first-child {
      width: 40%;
    }
    .footer-products-skeleton-card .skeleton-line:nth-child(2) {
      width: 90%;
    }
    @keyframes footer-products-skeleton-shine {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    /* Плавное появление только при первой загрузке */
    .footer-products-feed-content {
      animation: footer-products-fade-in 0.3s ease-out forwards;
    }
    @keyframes footer-products-fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    /* Отключаем scroll anchoring — не дёргает при подгрузке */
    #footer-products-feed {
      overflow-anchor: none;
    }
  </style>

  <div class="flex items-center justify-between gap-4 mb-4">
    <h2 class="text-xl md:text-2xl font-extrabold text-white">Еще товары</h2>
    <a href="{% url 'catalog:product_list' %}" class="text-sm text-accent hover:text-accent-hover transition-colors">Весь каталог</a>
  </div>

  <div
    id="footer-products-feed"
    data-feed-url="{% url 'catalog:footer_products_feed' %}"
    data-layout="{% if request.resolver_match and request.resolver_match.url_name == 'home' %}home{% else %}catalog{% endif %}"
    class="relative"
  >
    <div class="footer-products-skeleton" id="footer-products-skeleton" aria-hidden="true">
      {% for i in "123456789012345" %}
      <div class="footer-products-skeleton-card">
        <div class="skeleton-image"></div>
        <div class="skeleton-content">
          <div class="skeleton-line"></div>
          <div class="skeleton-line"></div>
        </div>
      </div>
      {% endfor %}
    </div>
    <div class="absolute inset-0 flex items-center justify-center pointer-events-none bg-dark-900/30">
      <div class="footer-products-loader" aria-label="Загрузка">
        <span class="footer-products-loader-dot"></span>
        <span class="footer-products-loader-dot"></span>
        <span class="footer-products-loader-dot"></span>
      </div>
    </div>
  </div>
</section>

<script>
  (function () {
    const feed = document.getElementById('footer-products-feed');
    if (!feed || feed.dataset.initialized === '1') return;
    feed.dataset.initialized = '1';

    const baseUrl = feed.dataset.feedUrl;
    const layout = feed.dataset.layout || 'catalog';
    if (!baseUrl) return;

    const initIcons = () => {
      if (window.lucide && typeof window.lucide.createIcons === 'function') {
        window.lucide.createIcons();
      }
    };

    const loaderHtml = () => (
      '<div class="footer-products-loader" aria-label="Загрузка">' +
        '<span class="footer-products-loader-dot"></span>' +
        '<span class="footer-products-loader-dot"></span>' +
        '<span class="footer-products-loader-dot"></span>' +
      '</div>'
    );

    let lastLoadTime = 0;
    const LOAD_COOLDOWN_MS = 1500;

    const loadChunk = async (url, target, replaceOuter) => {
      if (!url || !target || target.dataset.loading === '1') return;
      if (replaceOuter && Date.now() - lastLoadTime < LOAD_COOLDOWN_MS) return;
      target.dataset.loading = '1';
      try {
        const resp = await fetch(url, { credentials: 'same-origin' });
        if (!resp.ok) return;
        const html = await resp.text();
        const tpl = document.createElement('template');
        tpl.innerHTML = html;
        if (replaceOuter) {
          const existingGrid = feed.querySelector('.footer-products-grid');
          const incomingGrid = tpl.content.querySelector('.footer-products-grid');
          if (existingGrid && incomingGrid) {
            const scrollY = window.scrollY;
            const fragment = document.createDocumentFragment();
            Array.from(incomingGrid.children).forEach((card) => {
              fragment.appendChild(card);
            });
            existingGrid.appendChild(fragment);
            const continuation = tpl.content.querySelector('[data-footer-products-next], [data-footer-products-end]');
            if (continuation) {
              target.replaceWith(continuation);
            } else {
              target.remove();
            }
            window.scrollTo(0, scrollY);
          } else {
            target.replaceWith(tpl.content);
          }
          lastLoadTime = Date.now();
        } else {
          target.replaceChildren(tpl.content);
          const firstChild = feed.firstElementChild;
          if (firstChild) firstChild.classList.add('footer-products-feed-content');
        }
        initIcons();
      } catch (e) {
        console.error('Footer products load error', e);
      } finally {
        target.dataset.loading = '0';
        observeSentinels();
      }
    };

    const observer = 'IntersectionObserver' in window
      ? new IntersectionObserver((entries) => {
          entries.forEach((entry) => {
            if (!entry.isIntersecting) return;
            const sentinel = entry.target;
            observer.unobserve(sentinel);
            loadChunk(sentinel.dataset.nextUrl, sentinel, true);
          });
        }, { threshold: 0.1, rootMargin: '0px 0px -150px 0px' })
      : null;

    const observeSentinels = () => {
      const sentinels = feed.querySelectorAll('[data-footer-products-next]');
      sentinels.forEach((node) => {
        if (node.dataset.observed === '1') return;
        node.dataset.observed = '1';
        if (observer) {
          const elapsed = Date.now() - lastLoadTime;
          const delay = elapsed < LOAD_COOLDOWN_MS ? LOAD_COOLDOWN_MS - elapsed : 0;
          const doObserve = () => observer.observe(node);
          if (delay > 0) {
            setTimeout(doObserve, delay);
          } else {
            doObserve();
          }
          return;
        }
        node.classList.add('flex', 'justify-center');
        node.innerHTML = '<button type="button" class="inline-flex items-center justify-center rounded-lg bg-accent hover:bg-accent-hover text-dark-900 text-xs font-bold uppercase tracking-wide px-4 py-2 transition-colors">Загрузить еще</button>';
        const btn = node.querySelector('button');
        if (btn) {
          btn.addEventListener('click', () => loadChunk(node.dataset.nextUrl, node, true));
        }
      });
    };

    loadChunk(baseUrl + '?page=1&layout=' + encodeURIComponent(layout), feed, false);
  })();
</script>
