<article class="content-block content-block--hero-summary">
  <div class="content-block__text-shell">
    {% if item.data.title %}
      <h3 class="content-block__title">{{ item.data.title }}</h3>
    {% endif %}
    {% if item.data.lead %}
      <div class="content-block__body">{{ item.data.lead|linebreaks }}</div>
    {% endif %}
    {% if item.data.bullets %}
      <ul class="content-block__list">
        {% for bullet in item.data.bullets %}
          <li>{{ bullet }}</li>
        {% endfor %}
      </ul>
    {% endif %}
  </div>
  {% if item.image.url %}
    <div class="content-block__media-shell">
      <img src="{{ item.image.url }}" alt="{{ item.image.alt|default:item.data.title|default:product.name }}" class="content-block__image content-block__image--cover" loading="lazy" />
    </div>
  {% endif %}
</article>
