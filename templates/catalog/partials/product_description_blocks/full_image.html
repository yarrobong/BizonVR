<article class="content-block content-block--full-image">
  {% if item.data.title %}
    <h3 class="content-block__title">{{ item.data.title }}</h3>
  {% endif %}
  {% if item.image.url %}
    <div class="content-block__full-image-shell">
      <img src="{{ item.image.url }}" alt="{{ item.image.alt|default:item.data.title|default:product.name }}" class="content-block__image content-block__image--contain" loading="lazy" />
    </div>
  {% endif %}
  {% if item.image.caption %}
    <p class="content-block__caption">{{ item.image.caption }}</p>
  {% elif item.data.caption %}
    <p class="content-block__caption">{{ item.data.caption }}</p>
  {% endif %}
</article>
