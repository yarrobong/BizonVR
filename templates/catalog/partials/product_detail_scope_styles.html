<style>
  html { scroll-behavior: smooth; }

  .product-detail-scope {
    --pd-accent: #00D4FF;
    --pd-bg: #0d0f17;
    --pd-card: #151923;
    --pd-text: #ffffff;
    --pd-muted: #9ca3af;
    --pd-hover: #00B8E6;
    --pd-success: rgba(16, 196, 76, 1);

    font-family: 'GTEestiProDisplay', Arial, sans-serif;
    background-color: var(--pd-bg);
    color: var(--pd-text);
    font-size: 14px;
  }

  .product-detail-scope,
  .product-detail-scope * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  .product-detail-scope a { text-decoration: none; color: inherit; }
  .product-detail-scope ul { list-style: none; }
  .product-detail-scope button { cursor: pointer; border: none; font-family: inherit; }

  .product-detail-scope .container {
    max-width: 1440px;
    margin: 20px auto;
    padding: 0 16px;
  }

  .product-detail-scope .breadcrumbs {
    color: var(--pd-muted);
    font-size: 12px;
    margin-bottom: 16px;
  }
  .product-detail-scope .breadcrumbs span { margin: 0 5px; }

  .product-detail-scope .product-main {
    display: grid;
    /* Desktop layout: photo / info / purchase — proportional widths */
    grid-template-columns: minmax(360px, 40%) minmax(300px, 33%) minmax(280px, 27%);
    column-gap: 24px;
    row-gap: 30px;
    align-items: start;
    margin-bottom: 40px;
  }

  @media (max-width: 1024px) {
    .product-detail-scope .product-main {
      grid-template-columns: 1fr;
      gap: 18px;
    }

    .product-detail-scope .gallery-container {
      position: relative;
      top: 0;
    }

    .product-detail-scope .thumbs {
      flex-direction: row;
      overflow-x: auto;
      padding-bottom: 6px;
    }

    .product-detail-scope .buy-box {
      position: relative;
      top: 0;
      margin-left: 0;
    }

    .product-detail-scope .delivery-section {
      margin-left: 0;
    }

    .product-detail-scope .gallery-container,
    .product-detail-scope .product-info,
    .product-detail-scope .right-col {
      grid-column: auto;
      grid-row: auto;
    }

    .product-detail-scope .cards-grid {
      grid-template-columns: repeat(2, 1fr);
    }
  }

  /* Gallery */
  .product-detail-scope .gallery-container {
    display: flex;
    gap: 10px;
    position: relative;
    grid-column: 1;
    grid-row: 1;
  }

  .product-detail-scope .thumbs {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .product-detail-scope .thumb {
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    cursor: pointer;
    border: 2px solid transparent;
    background: rgba(255,255,255,0.04);
    overflow: hidden;
  }
  .product-detail-scope .thumb.active { border-color: var(--pd-accent); }

  .product-detail-scope .thumb-media {
    width: 100%;
    height: 100%;
    display: block;
    border-radius: 6px;
  }

  .product-detail-scope .thumb-media--image { object-fit: contain; }
  .product-detail-scope .thumb-media--video { object-fit: cover; }

  .product-detail-scope .thumb-video {
    position: relative;
    width: 100%;
    height: 100%;
    background: linear-gradient(160deg, rgba(0,212,255,0.18), rgba(21,25,35,0.95));
  }

  .product-detail-scope .thumb-video--fallback {
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(160deg, rgba(0,212,255,0.16), rgba(13,15,23,0.98));
  }

  .product-detail-scope .thumb-video-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.92);
  }

  .product-detail-scope .thumb-video-play {
    position: absolute;
    right: 4px;
    bottom: 4px;
    width: 14px;
    height: 14px;
    border-radius: 999px;
    background: rgba(0,0,0,0.72);
  }

  .product-detail-scope .thumb-video-play::before {
    content: '';
    position: absolute;
    left: 5px;
    top: 3px;
    border-top: 4px solid transparent;
    border-bottom: 4px solid transparent;
    border-left: 6px solid #fff;
  }

  .product-detail-scope .main-image-wrapper {
    position: relative;
    width: 100%;
    margin-left: 16px;
    height: auto;
    aspect-ratio: 1 / 1;
    background: var(--pd-card);
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.08);
    touch-action: pan-y;
  }

  .product-detail-scope .main-image {
    display: block;
    width: 100%;
    height: 100%;
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }

  .product-detail-scope .main-image-shell,
  .product-detail-scope .main-video-shell {
    width: 100%;
    height: 100%;
  }

  .product-detail-scope .main-video-shell {
    background: #05070d;
  }

  .product-detail-scope .main-video {
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
    background: #05070d;
  }

  /* Fallback for browsers without aspect-ratio support (e.g. older iOS Safari) */
  @supports not (aspect-ratio: 1 / 1) {
    .product-detail-scope .main-image-wrapper {
      height: 0;
      padding-top: 100%;
    }
    .product-detail-scope .main-image-wrapper > img,
    .product-detail-scope .main-image-wrapper > div {
      position: absolute;
      inset: 0;
    }
    .product-detail-scope .main-image {
      width: 100%;
      height: 100%;
    }
    .product-detail-scope .main-image-wrapper > div {
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 16px;
    }
    .product-detail-scope .main-video-shell,
    .product-detail-scope .main-image-shell {
      position: absolute;
      inset: 0;
    }
  }

  @media (min-width: 1025px) {
    .product-detail-scope .gallery-container {
      min-width: 0;
    }
    .product-detail-scope .main-image-wrapper {
      flex: 1 1 auto;
      width: auto;
      min-width: 0;
    }
    .product-detail-scope .main-image { width: 100%; height: 100%; max-width: 100%; max-height: 100%; }
    .product-detail-scope .thumb { width: 48px; height: 48px; }
  }

  /* Center: Info */
  .product-detail-scope .product-info {
    grid-column: 2;
    grid-row: 1;
    min-width: 0;
  }

  .product-detail-scope .product-info h1 {
    font-size: 28px;
    margin-bottom: 10px;
    line-height: 1.2;
  }

  .product-detail-scope .variants-title { font-size: 14px; margin-bottom: 8px; color: var(--pd-muted); }
  .product-detail-scope .color-variants {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }

  .product-detail-scope .color-opt {
    width: 50px;
    height: 50px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.12);
    cursor: pointer;
    overflow: hidden;
    background: rgba(255,255,255,0.04);
  }
  .product-detail-scope .color-opt img { width: 100%; height: 100%; object-fit: contain; }
  .product-detail-scope .color-opt.selected { border: 2px solid var(--pd-accent); }

  .product-detail-scope .short-specs { margin-top: 20px; }
  .product-detail-scope .short-specs-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .product-detail-scope .short-specs-title {
    font-size: 16px;
    font-weight: 700;
    color: var(--pd-text);
  }
  .product-detail-scope .short-specs-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    background: rgba(255,255,255,0.08);
    border-radius: 20px;
    color: var(--pd-muted);
    font-size: 13px;
    font-weight: 500;
    transition: background 0.2s;
  }
  .product-detail-scope .short-specs-link:hover {
    background: rgba(255,255,255,0.12);
    color: var(--pd-text);
  }
  .product-detail-scope .short-specs-list { display: flex; flex-direction: column; }
  .product-detail-scope .short-specs .spec-line {
    display: flex;
    padding: 12px 0;
    font-size: 14px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .product-detail-scope .short-specs .spec-line:last-child { border-bottom: none; }
  .product-detail-scope .short-specs .spec-line .spec-key {
    color: var(--pd-muted);
    width: 180px;
    min-width: 180px;
    flex-shrink: 0;
  }
  .product-detail-scope .short-specs .spec-line .spec-value { color: var(--pd-text); flex: 1; }

  .product-detail-scope .buy-box {
    background: var(--pd-card);
    padding: 24px;
    border-radius: 16px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.35);
    height: fit-content;
    position: relative;
    border: 1px solid rgba(255,255,255,0.08);
    color: var(--pd-text);
  }

  .product-detail-scope .price-block { margin-bottom: 20px; }
  .product-detail-scope .price-row { display: flex; align-items: baseline; gap: 8px; }
  .product-detail-scope .main-price { font-size: 28px; font-weight: 800; color: var(--pd-success); }

  .product-detail-scope .add-cart-btn {
    background: var(--pd-accent);
    color: #001a34;
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 12px;
  }
  .product-detail-scope .add-cart-btn:hover { background: var(--pd-hover); }

  .product-detail-scope .buy-now-btn {
    width: 100%;
    padding: 12px;
    background: rgba(255,255,255,0.06);
    color: var(--pd-accent);
    border-radius: 8px;
    font-weight: 700;
    border: 1px solid rgba(255,255,255,0.12);
  }
  .product-detail-scope .buy-now-btn:hover {
    border-color: rgba(0, 212, 255, 0.35);
    background: rgba(0, 212, 255, 0.08);
  }

  .product-detail-scope .delivery-section {
    background: var(--pd-card);
    padding: 24px;
    border-radius: 16px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.35);
    border: 1px solid rgba(255,255,255,0.08);
    font-size: 14px;
    color: var(--pd-text);
  }

  .product-detail-scope .right-col {
    display: flex;
    flex-direction: column;
    row-gap: 24px;
    grid-column: 3;
    grid-row: 1;
    min-width: 0;
    align-self: start;
  }
  .product-detail-scope .delivery-section-title {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 12px;
  }
  .product-detail-scope .delivery-row { display: flex; gap: 10px; margin-bottom: 12px; }
  .product-detail-scope .delivery-row:last-child { margin-bottom: 0; }

  /* Recommendations */
  .product-detail-scope .section-title { font-size: 24px; margin: 40px 0 20px; font-weight: 800; }

  .product-detail-scope .rec-panel {
    border: 1px solid rgba(255, 255, 255, 0.10);
    background: rgba(21, 25, 35, 0.72);
    border-radius: 16px;
    padding: 14px;
  }

  .product-detail-scope .rec-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 12px;
  }

  .product-detail-scope .rec-tab-btn {
    border: 1px solid transparent;
    border-radius: 999px;
    background: rgba(31, 37, 50, 0.95);
    color: #c4c9d4;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 600;
    line-height: 1.2;
    transition: background 0.2s, color 0.2s, box-shadow 0.2s;
  }

  .product-detail-scope .rec-tab-btn:hover {
    color: #fff;
    background: rgba(45, 53, 71, 0.95);
  }

  .product-detail-scope .rec-tab-btn.is-active {
    background: var(--pd-accent);
    color: #001a34;
    box-shadow: 0 8px 20px rgba(0, 212, 255, 0.28);
  }

  .product-detail-scope .rec-caption {
    margin-bottom: 10px;
    color: var(--pd-muted);
    font-size: 12px;
  }

  .product-detail-scope .rec-caption strong {
    color: var(--pd-accent);
    font-weight: 700;
  }

  .product-detail-scope .rec-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
  }

  @media (min-width: 768px) {
    .product-detail-scope .rec-grid {
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }
  }

  @media (min-width: 1024px) {
    .product-detail-scope .rec-grid {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }
  }

  @media (min-width: 1280px) {
    .product-detail-scope .rec-grid {
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 16px;
    }
  }

  .product-detail-scope .cards-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 15px;
    margin-bottom: 40px;
  }

  .product-detail-scope .card {
    background: var(--pd-card);
    border-radius: 12px;
    padding: 10px;
    position: relative;
    transition: 0.2s;
    border: 1px solid rgba(255,255,255,0.06);
  }
  .product-detail-scope .card:hover { box-shadow: 0 12px 30px rgba(0,0,0,0.35); border-color: rgba(0, 212, 255, 0.20); }

  .product-detail-scope .card-img-wrapper {
    position: relative;
    aspect-ratio: 1 / 1;
    height: auto;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: var(--pd-card);
  }
  .product-detail-scope .card-img-wrapper a {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
  }
  .product-detail-scope .card-img { max-width: 100%; max-height: 100%; object-fit: contain; }

  .product-detail-scope .fav-icon {
    /* Позиционирование задаём в шаблоне (tailwind-классами),
       чтобы везде было одинаково: справа сверху + отступы на md+. */
    position: absolute;
    color: rgba(255,255,255,0.65);
    cursor: pointer;
  }

  .product-detail-scope .card-price { font-weight: 800; font-size: 18px; color: var(--pd-accent); margin-bottom: 4px; }
  .product-detail-scope .card-old-price { font-size: 12px; color: var(--pd-muted); text-decoration: line-through; }
  .product-detail-scope .card-title {
    font-size: 13px;
    line-height: 1.4;
    color: var(--pd-muted);
    margin-bottom: 5px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* Description & Specs */
  .product-detail-scope .details-section {
    background: var(--pd-card);
    padding: 30px;
    border-radius: 16px;
    margin-bottom: 50px;
    border: 1px solid rgba(255,255,255,0.08);
  }
  .product-detail-scope .desc-text {
    font-size: 15px;
    line-height: 1.6;
    margin-bottom: 30px;
    max-width: 800px;
  }
  .product-detail-scope .details-collapsible {
    margin-bottom: 30px;
    position: relative;
  }
  .product-detail-scope .details-collapsible-content {
    position: relative;
    overflow: hidden;
    max-height: 800px;
    padding-bottom: 84px;
    transition: max-height 0.28s ease;
  }
  .product-detail-scope .details-collapsible-content.is-expanded {
    max-height: none;
    padding-bottom: 0;
  }
  .product-detail-scope .details-collapsible-fade {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 160px;
    background: linear-gradient(180deg, rgba(21,25,35,0), rgba(21,25,35,0.72) 42%, rgba(21,25,35,0.98) 100%);
    pointer-events: none;
    z-index: 1;
  }
  .product-detail-scope .details-collapsible-actions {
    position: absolute;
    right: 20px;
    bottom: 20px;
    z-index: 2;
  }
  .product-detail-scope .details-collapsible-actions.is-expanded {
    position: static;
    display: flex;
    justify-content: flex-end;
    margin-top: 18px;
  }
  .product-detail-scope .details-toggle-btn {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 18px 20px;
    border-radius: 16px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    color: var(--pd-text);
    font-size: 15px;
    font-weight: 800;
    transition: border-color 0.2s ease, background 0.2s ease, color 0.2s ease;
  }
  .product-detail-scope .details-toggle-btn--corner {
    min-width: 188px;
    box-shadow: 0 18px 40px rgba(0,0,0,0.28);
    background: rgba(10,14,24,0.92);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }
  .product-detail-scope .details-toggle-btn:hover {
    background: rgba(0,212,255,0.08);
    border-color: rgba(0,212,255,0.24);
  }
  .product-detail-scope .details-toggle-btn__icon {
    width: 20px;
    height: 20px;
    flex: 0 0 20px;
    transition: transform 0.2s ease;
  }
  .product-detail-scope .details-toggle-btn__icon.is-open {
    transform: rotate(180deg);
  }
  .product-detail-scope .details-rich-blocks {
    display: flex;
    flex-direction: column;
    gap: 24px;
  }
  .product-detail-scope .content-block {
    background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02));
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 20px;
    padding: 24px;
    overflow: hidden;
  }
  .product-detail-scope .content-block__title {
    font-size: 24px;
    line-height: 1.2;
    font-weight: 800;
    margin-bottom: 14px;
  }
  .product-detail-scope .content-block__body {
    max-width: 760px;
    color: rgba(255,255,255,0.88);
    font-size: 15px;
    line-height: 1.75;
  }
  .product-detail-scope .content-block__body p + p {
    margin-top: 12px;
  }
  .product-detail-scope .content-block--image-text {
    display: grid;
    grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.95fr);
    gap: 28px;
    align-items: center;
  }
  .product-detail-scope .content-block--image-text.is-image-right .content-block__media-shell {
    order: 2;
  }
  .product-detail-scope .content-block--image-text.is-image-right .content-block__text-shell {
    order: 1;
  }
  .product-detail-scope .content-block__media-shell,
  .product-detail-scope .content-block__full-image-shell,
  .product-detail-scope .content-block__video-shell {
    background: rgba(0,0,0,0.18);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 18px;
    overflow: hidden;
  }
  .product-detail-scope .content-block__media-shell {
    min-height: 320px;
  }
  .product-detail-scope .content-block__image {
    display: block;
    width: 100%;
    height: 100%;
  }
  .product-detail-scope .content-block__image--cover {
    min-height: 320px;
    object-fit: cover;
  }
  .product-detail-scope .content-block__full-image-shell {
    padding: 10px;
  }
  .product-detail-scope .content-block__image--contain {
    max-height: 640px;
    object-fit: contain;
    background: rgba(0,0,0,0.1);
  }
  .product-detail-scope .content-block__video-shell {
    padding: 10px;
  }
  .product-detail-scope .content-block__video {
    display: block;
    width: 100%;
    aspect-ratio: 16 / 9;
    min-height: 240px;
    max-height: 640px;
    border-radius: 14px;
    background: #05070d;
  }
  .product-detail-scope .content-block__caption {
    margin-top: 14px;
    color: var(--pd-muted);
    font-size: 13px;
    line-height: 1.5;
  }
  .product-detail-scope .specs-title { font-size: 20px; font-weight: 800; margin-bottom: 20px; }
  .product-detail-scope .specs-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 40px;
    max-width: 900px;
  }
  .product-detail-scope .spec-item { margin-bottom: 15px; }
  .product-detail-scope .spec-label { color: var(--pd-muted); font-size: 14px; margin-bottom: 4px; }
  .product-detail-scope .details-section .spec-value { font-size: 15px; color: var(--pd-text); }

  /* Shared visibility helpers */
  @media (max-width: 768px) {
    .product-detail-scope .desktop-only { display: none !important; }
  }
  @media (min-width: 769px) {
    .product-detail-scope .mobile-only { display: none !important; }
  }

  /* Mobile overrides */
  @media (max-width: 768px) {
    .product-detail-scope .container {
      padding: 0;
      margin: 0;
      max-width: 100%;
    }

    .product-detail-scope .breadcrumbs { display: none; }

    .product-detail-scope .product-main {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 156px; /* space for floating bar + dock */
    }

    .product-detail-scope .gallery-container {
      flex-direction: column;
      background: var(--pd-card);
      padding-bottom: 14px;
      border-radius: 0 0 24px 24px;
    }

    .product-detail-scope .thumbs { display: none; }

    .product-detail-scope .main-image-wrapper {
      margin-left: 0;
      border-radius: 0;
      border: none;
      background: transparent;
      /* iOS Safari: aspect-ratio can be unreliable inside flex layouts.
         Force a stable square height on real devices. */
      height: 100vw;
      max-height: 520px;
    }

    .product-detail-scope .dots {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-top: 10px;
    }
    .product-detail-scope .dot {
      width: 6px;
      height: 6px;
      background-color: var(--pd-muted);
      border-radius: 50%;
