<article class="content-block content-block--video">
  {% if block.title %}
    <h3 class="content-block__title">{{ block.title }}</h3>
  {% endif %}
  {% if block.embed_url %}
    {% include "catalog/partials/_lazy_video_embed.html" with embed_url=block.embed_url title=block.title %}
  {% endif %}
  {% if block.caption %}
    <p class="content-block__caption">{{ block.caption }}</p>
  {% endif %}
</article>
