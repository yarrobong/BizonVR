{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Страница не найдена | BizonVR</title>
  {% include "layout/_alfatrack.html" %}
  <link rel="stylesheet" href="{% static 'css/layout/fonts.css' %}">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0f1115;
      color: #fff;
      font-family: 'Onest', system-ui, sans-serif;
      padding: 24px;
    }
    .card {
      width: min(560px, 100%);
      background: #181b21;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 24px;
      box-sizing: border-box;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 28px;
    }
    p {
      margin: 0 0 20px;
      color: #b6bdc8;
      line-height: 1.5;
    }
    a {
      display: inline-block;
      background: #f59e0b;
      color: #111;
      text-decoration: none;
      padding: 10px 16px;
      border-radius: 999px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  {% include "layout/_yandex_metrika.html" %}
  <main class="card">
    <h1>404</h1>
    <p>Страница не найдена или была перемещена. Проверьте адрес или вернитесь на главную.</p>
    <a href="/">На главную</a>
  </main>
</body>
</html>
