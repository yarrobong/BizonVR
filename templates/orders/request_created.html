{% extends "base.html" %}
{% load catalog_tags %}

{% block title %}Заявка отправлена — BizonVR{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-12 max-w-2xl text-center">
  <div class="bg-dark-800 border border-dark-600 rounded-xl p-8">
    <div class="w-16 h-16 mx-auto mb-6 rounded-full bg-accent/20 flex items-center justify-center">
      <i data-lucide="check" class="w-8 h-8 text-accent"></i>
    </div>
    <h1 class="text-2xl font-light text-white mb-4">Заявка отправлена</h1>
    <p class="text-gray-400 mb-6">
      Спасибо. Заявка принята и будет обработана менеджером после дополнительной проверки.
    </p>
    <a href="{% url 'catalog:product_list' %}" class="inline-flex gap-2 bg-accent hover:bg-accent-hover text-dark-900 font-bold py-3 px-6 rounded-full text-sm uppercase tracking-wide transition-colors">
      Вернуться в каталог
      <i data-lucide="arrow-right" class="w-4 h-4"></i>
    </a>
  </div>
</div>
{% endblock %}
