{% extends "base.html" %}

{% block title %}Подтверждение заказа #{{ order_id }} — BizonVR{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-12 max-w-md">
  <h1 class="text-2xl font-light text-white mb-2">Доступ к заказу #{{ order_id }}</h1>
  <p class="text-gray-400 text-sm mb-6">Введите телефон, указанный при оформлении заказа.</p>

  <form method="post" class="space-y-4">
    {% csrf_token %}
    {% if error %}
    <p class="text-red-400 text-sm">{{ error }}</p>
    {% endif %}
    <div>
      <label for="id_phone" class="block text-sm text-gray-400 mb-1">Телефон</label>
      <input type="tel" name="phone" id="id_phone" required
             placeholder="+7 (999) 123-45-67"
             class="w-full bg-dark-700 text-white rounded-lg py-2.5 px-4 focus:outline-none focus:ring-1 focus:ring-accent"
             autocomplete="tel">
    </div>
    <button type="submit" class="w-full bg-accent hover:bg-accent-hover text-dark-900 font-bold py-3 px-4 rounded-full transition-colors">
      Показать заказ
    </button>
  </form>

  <p class="text-gray-500 text-xs mt-6">
    <a href="{% url 'orders:order_guest_lookup' %}" class="text-accent hover:text-accent-hover">← Другой заказ</a>
  </p>
</div>
{% endblock %}
