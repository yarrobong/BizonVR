    body {
      margin: 0;

      display: grid;
      place-items: center;
      background: #0f1115;
      color: #fff;
      font-family: Inter, system-ui, sans-serif;
      padding: 24px;
    }
    .card {
      width: min(560px, 100%);
      background: #181b21;
      border: 1px solid rgba(255, 255, 255, 0.08);

      padding: 24px;
      box-sizing: border-box;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 28px;
    }
    p {
      margin: 0 0 20px;
      color: #b6bdc8;
      line-height: 1.5;
    }
    a {
      display: inline-block;
      background: #f59e0b;
      color: #111;
      text-decoration: none;
      padding: 10px 16px;
      border-radius: 999px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>500</h1>
    <p>Внутренняя ошибка сервера. Попробуйте обновить страницу позже.</p>
