{% extends "manager_portal/base.html" %}

{% block title %}{{ module_title }}{% endblock %}

{% block content %}
  <div class="space-y-8">
    <section class="manager-entry-hero manager-panel rounded-[1.75rem] p-6 lg:p-8">
      <div class="manager-entry-hero-grid">
        <div>
          <p class="text-sm uppercase tracking-[0.24em] text-cyan-300">Module</p>
          <h2 class="mt-3 text-4xl font-semibold lg:text-5xl">{{ module_title }}</h2>
          <p class="mt-3 max-w-3xl text-slate-300">{{ module_summary }}</p>
          <div class="mt-6 flex flex-wrap gap-2">
            <span class="manager-pill"><strong>Статус</strong> {{ module_status }}</span>
          </div>
        </div>
        <div class="manager-entry-summary">
          <div class="manager-entry-summary-card">
            <p class="manager-dashboard-alert-label">План модуля</p>
            <div class="mt-4 space-y-3">
              {% for point in module_points %}
                <div class="manager-dashboard-alert-row">
                  <span class="text-slate-300">{{ point }}</span>
                  <strong>•</strong>
                </div>
              {% endfor %}
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>
{% endblock %}
