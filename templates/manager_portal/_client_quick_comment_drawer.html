<div class="flex items-start justify-between gap-4">
  <div>
    <p class="text-xs uppercase tracking-[0.2em] text-slate-500">Быстрое действие</p>
    <h2 class="mt-2 text-2xl font-semibold text-white">Комментарий по клиенту</h2>
    <p class="mt-2 text-sm text-slate-400">{{ client.name }}</p>
  </div>
  <button type="button" data-drawer-close class="rounded-full border border-slate-700 px-3 py-1 text-sm">Закрыть</button>
</div>

<form
  method="post"
  action="{% url 'manager_portal:client_quick_comment' client.pk %}"
  hx-post="{% url 'manager_portal:client_quick_comment' client.pk %}"
  hx-target="#manager-remote-drawer-content"
  hx-swap="innerHTML"
  hx-push-url="false"
  class="mt-6 space-y-4"
>
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ next_url }}">
  {% include "manager_portal/_form_fields.html" with form=form %}
  <div class="flex flex-wrap gap-2">
    <button type="submit" class="rounded-xl bg-cyan-500 px-4 py-3 text-sm font-medium text-slate-950 hover:bg-cyan-400">Сохранить комментарий</button>
    <button type="button" data-drawer-close class="manager-inline-action">Отмена</button>
  </div>
</form>

{% if client.comments %}
  <section class="manager-preview-item mt-6">
    <p class="manager-preview-label">Текущий комментарий</p>
    <p class="mt-3 whitespace-pre-line text-sm leading-6 text-slate-300">{{ client.comments }}</p>
  </section>
{% endif %}
