<div class="manager-theme-toggle" data-manager-theme-toggle>
  <span class="manager-theme-toggle-label">Тема</span>
  <div class="manager-theme-toggle-options" role="group" aria-label="Тема интерфейса">
    <button
      type="button"
      class="manager-theme-toggle-button is-active"
      data-manager-theme-option="light"
      aria-pressed="true"
    >
      Светлая
    </button>
    <button
      type="button"
      class="manager-theme-toggle-button"
      data-manager-theme-option="dark"
      aria-pressed="false"
    >
      Темная
    </button>
  </div>
</div>
