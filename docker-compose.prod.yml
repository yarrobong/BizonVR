# Продакшен: образ без монтирования кода, переменные из .env на сервере.
# Запуск: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Или: docker compose --env-file .env -f docker-compose.prod.yml up -d (если prod переопределяет всё)

services:
  web:
    image: portal-shop:latest
    networks:
      - app
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DEBUG: "${DEBUG:-False}"
      USE_HTTPS: "${USE_HTTPS:-1}"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      SECRET_KEY: ${SECRET_KEY}
      DB_HOST: db
      DB_PORT: "5432"
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    # Слушаем только localhost — снаружи доступ через Nginx
    ports:
      - "127.0.0.1:${PORT:-8001}:8000"

  db:
    image: postgres:16-alpine
    networks:
      - app
    env_file: .env
    environment:
      POSTGRES_DB: ${DB_NAME:-bizon}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-bizon}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    # В продакшене не открываем порт БД наружу
    ports: []

volumes:
  postgres_data:
  static_volume:
  media_volume:
