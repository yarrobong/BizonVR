services:
  postgres:
    image: postgres:16-alpine
    container_name: businessfinance_db
    environment:
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: finance
      POSTGRES_DB: finance
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance -d finance"]
      interval: 3s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: businessfinance_app
    ports:
      - "8501:8501"
    environment:
      PORT: "8501"
      DATABASE_URL: postgresql://finance:finance@postgres:5432/finance
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-admin}
      COOKIE_SECRET: ${COOKIE_SECRET:-bf-docker-secret}
      SESSION_EXPIRE_DAYS: ${SESSION_EXPIRE_DAYS:-7}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
